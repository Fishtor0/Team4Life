<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<title>Register</title>
		<link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.7.1/css/all.css">
        <link href="style.css" rel="stylesheet" type="text/css">
	</head>
	<body>
		<div class="register">
			<h1>Register</h1>
			<form action="db/register.php" method="post" autocomplete="off">
				<label for="username">
					<i class="fas fa-user"></i>
				</label>
				<input type="text" name="username" placeholder="Username" id="username" required>
				
				<label for="password">
					<i class="fas fa-lock"></i>
				</label>
				<input type="password" name="password" placeholder="Password" id="password" required>
				
				<label for="email">
					<i class="fas fa-envelope"></i>
				</label>
				<input type="email" name="email" placeholder="Email" id="email" required>
				
				<label for="given_name">
					<i class="fas fa-user"></i>
				</label>
				<input type="text" name="given_name" placeholder="Name" id="given_name" required>

				<label class="no_bcg" for="surname">
					<i class="fas"></i>
				</label>
				<input type="text" name="surname" placeholder="Surname" id="surname" required >

				<label for="dob">
					<i class="fas fa-calendar"></i>
				</label><br>
				<input type="text" name="dob" placeholder="D.O.B" id="dob" required>

				<input type="submit" value="Register">
			</form>
			<form action="index.html" method="post">
				<input type="submit" value="Login">
			</form>
		</div>
	</body>
</html>
